<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Manager - Taberna</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Lista de Personajes en la Taberna</h1>
    <table>
        <thead>
            <tr>
              <th>Nombre</th>
              <th>Clase</th>
              <th>Nivel</th>
              <th>Vida</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Aragorn</td>
                <td>Guerrero</td>
                <td>10</td>
                <td>100</td>
            </tr>
        </tbody>
    </table>
    
      <h3 class="mb-3 text-center">Formulario de Personajes</h3>
      <form>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre">
        </div>
        <div class="mb-3">
          <label for="clase" class="form-label">Clase</label>
          <input type="text" class="form-control" id="clase" placeholder="Escribe la clase del personaje">
        </div>
        <div class="mb-3">
          <label for="nivel" class="form-label">Nivel</label>
          <input type="number" class="form-control" id="nivel" placeholder="Escribe el nivel del personaje">
        </div>
        <button type="submit" class="btn btn-primary w-100">CrearPersonaje</button>
      </form>


    </body>
</html>
