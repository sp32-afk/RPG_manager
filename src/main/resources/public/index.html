<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Manager - Taberna</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="container py-4">

    <h1 class="mb-4 text-center">Lista de Personajes en la Taberna</h1>
    
    <table class="table table-striped table-hover mb-5">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Clase</th>
                <th>Nivel</th>
                <th>Vida</th>
            </tr>
        </thead>
        <tbody id="tabla-personajes">
            <!-- Las filas se cargarán dinámicamente desde la API /personajes -->
        </tbody>
    </table>
    
    <h3 class="mb-3 text-center">Formulario de Personajes</h3>
    <!-- Se especifican action y method para capturar los datos en Javalin -->
    <form action="/personajes" method="POST" class="card p-4 shadow-sm mx-auto" style="max-width: 500px;">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
        </div>
        <div class="mb-3">
          <label for="clase" class="form-label">Clase</label>
          <input type="text" class="form-control" id="clase" name="clase" placeholder="Guerrero, Mago o Arquero" required>
        </div>
        <div class="mb-3">
          <label for="nivel" class="form-label">Nivel</label>
          <input type="number" class="form-control" id="nivel" name="nivel" placeholder="Nivel entre 1 y 100" min="1" max="100" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Crear Personaje</button>
    </form>

    <script>
      // Cargar la lista de personajes desde el backend Javalin mediante fetch
      fetch('/personajes')
        .then(response => response.json())
        .then(personajes => {
          const tbody = document.getElementById('tabla-personajes');
          tbody.innerHTML = '';
          personajes.forEach(p => {
            const row = `<tr>
              <td>${p.nombre}</td>
              <td>${p.clase}</td>
              <td>${p.nivel}</td>
              <td>${p.vida}</td>
            </tr>`;
            tbody.innerHTML += row;
          });
        })
        .catch(error => console.error('Error al obtener personajes:', error));
    </script>
</body>
</html>
